# Publishes salet.uk to Cloudflare Pages (project "salet") on every push to main.
# Lets the site be changed from anywhere (e.g. Claude Code on the web) with no laptop.
# Needs one GitHub secret: CLOUDFLARE_API_TOKEN (Cloudflare token, "Cloudflare Pages: Edit").
name: Deploy salet.uk
on:
  push:
    branches: [main]
  workflow_dispatch: {}
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx wrangler@3 pages deploy dist --project-name=salet --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 2df6421c22654c6b1dd45fea33940036
